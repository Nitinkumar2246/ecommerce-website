<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MyStore</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        MyStore
    </div>

    <a href="index.html" class="home-link">
        🏠 Home
    </a>

</header>


<section class="auth-section">

    <div class="auth-box">

        <h1>
            Create Account
        </h1>

        <p>
            Register for your MyStore account
        </p>


        <form id="registerForm">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match!"
                );

                return;
            }


            const user = {

                name: name,

                email: email,

                password: password

            };


            localStorage.setItem(
                "user",
                JSON.stringify(user)
            );


            alert(
                "Registration successful!"
            );


            window.location.href =
                "login.html";

        }
    );

</script>

</body>
</html>
