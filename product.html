<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Details - MyStore</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            MyStore
        </div>


        <button
            id="cartBtn"
            onclick="openCart()"
        >

            🛒 Cart

        </button>

    </header>



    <!-- PRODUCT DETAILS -->

    <section class="product-details">

        <div id="productDetails">

        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script>

        const products = [

            {
                id: 1,

                name:
                    "Wireless Headphones",

                price:
                    1499,

                image:
                    "https://picsum.photos/500/400?random=1",

                description:
                    "High quality wireless headphones with clear sound, comfortable design and long battery life."

            },


            {
                id: 2,

                name:
                    "Smart Watch",

                price:
                    2499,

                image:
                    "https://picsum.photos/500/400?random=2",

                description:
                    "Smart watch with fitness tracking, heart-rate monitoring and stylish design."

            },


            {
                id: 3,

                name:
                    "Running Shoes",

                price:
                    1999,

                image:
                    "https://picsum.photos/500/400?random=3",

                description:
                    "Comfortable running shoes suitable for daily running, walking and workouts."

            },


            {
                id: 4,

                name:
                    "Backpack",

                price:
                    999,

                image:
                    "https://picsum.photos/500/400?random=4",

                description:
                    "Durable backpack with spacious compartments for college, office and travel."

            },


            {
                id: 5,

                name:
                    "Mobile Phone",

                price:
                    14999,

                image:
                    "https://picsum.photos/500/400?random=5",

                description:
                    "Modern smartphone with powerful performance, excellent camera and large display."

            },


            {
                id: 6,

                name:
                    "Laptop",

                price:
                    49999,

                image:
                    "https://picsum.photos/500/400?random=6",

                description:
                    "Powerful laptop suitable for coding, study, office work and entertainment."

            }

        ];



        /* GET PRODUCT ID */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const productId =
            Number(
                urlParams.get("id")
            );


        /* FIND PRODUCT */

        const product =
            products.find(
                item =>
                    item.id === productId
            );


        const productDetails =
            document.getElementById(
                "productDetails"
            );


        /* DISPLAY */

        if (product) {

            productDetails.innerHTML = `

                <div class="details-card">


                    <div class="details-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>


                    <div class="details-info">

                        <h1>
                            ${product.name}
                        </h1>


                        <h2>
                            ₹${product.price}
                        </h2>


                        <p>
                            ${product.description}
                        </p>


                        <button
                            class="add-cart"
                            onclick="addToCart()"
                        >

                            Add to Cart

                        </button>


                        <br>
                        <br>


                        <a href="index.html">

                            ← Continue Shopping

                        </a>

                    </div>

                </div>

            `;

        }

        else {

            productDetails.innerHTML = `

                <h2>
                    Product Not Found!
                </h2>

                <br>

                <a href="index.html">
                    Go Back Home
                </a>

            `;

        }



        /* ADD TO CART */

        function addToCart() {

            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                ) || [];


            const existingProduct =
                cart.find(
                    item =>
                        item.id === product.id
                );


            if (existingProduct) {

                existingProduct.quantity++;

            }

            else {

                cart.push({

                    ...product,

                    quantity: 1

                });

            }


            localStorage.setItem(

                "cart",

                JSON.stringify(cart)

            );


            alert(
                product.name +
                " added to cart!"
            );

        }



        /* OPEN CART */

        function openCart() {

            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
